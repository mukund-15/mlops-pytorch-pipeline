apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
    project: mlops-pytorch-pipeline
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: model-serving

  template:
    metadata:
      labels:
        app: model-serving
        project: mlops-pytorch-pipeline

    spec:
      containers:
        - name: model-server
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent

          env:
            - name: MLOPS_CHECKPOINT_PATH
              value: /app/checkpoints/classifier_v1.pt

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: checkpoint-storage
              mountPath: /app/checkpoints
              subPath: checkpoints
              readOnly: true

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            initialDelaySeconds: 15

      volumes:
        - name: checkpoint-storage
          persistentVolumeClaim:
            claimName: mlops-storage
