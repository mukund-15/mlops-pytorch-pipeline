apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
  labels:
    app: model-training
    project: mlops-pytorch-pipeline
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never

      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent

          env:
            - name: MLOPS_DATA_DIR
              value: /app/data
            - name: MLOPS_CHECKPOINT_DIR
              value: /app/checkpoints

          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true

            - name: mlops-storage
              mountPath: /app/data
              subPath: data

            - name: mlops-storage
              mountPath: /app/checkpoints
              subPath: checkpoints

          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

      volumes:
        - name: training-config
          configMap:
            name: training-config

        - name: mlops-storage
          persistentVolumeClaim:
            claimName: mlops-storage
